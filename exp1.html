<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Lab</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f0f0f0;
        }
       .container {
            background: white;
            padding: 30px 50px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 500px;
        }
        h1 { margin-bottom: 20px; }
        input {
            padding: 8px;
            width: 80%;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 15px;
            margin: 5px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #0056b3; }
        #para { margin-top: 20px; font-size: 16px; }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <h1 id="heading">Welcome to JavaScript Lab</h1>
        <input type="text" id="inputText" placeholder="Enter new heading text">
        <br>
        <button onclick="changeHeading()">Change Heading</button>
        <button onclick="changeBackground()">Change Background</button>
        <button onclick="increaseFont()">Increase Font Size</button>
        <br>
        <button onclick="togglePara()">Show/Hide Paragraph</button>
        <button onclick="resetPage()">Reset</button>
        
        <p id="para">This is a sample paragraph. JavaScript events can dynamically change content.</p>
    </div>

    <script>
        let originalHeading = "Welcome to JavaScript Lab";
        let originalBg = "white";
        let originalFont = 16;

        function changeHeading() {
            let text = document.getElementById("inputText").value;
            if(text) document.getElementById("heading").innerText = text;
        }

        function changeBackground() {
            document.getElementById("mainContainer").style.background = "#7FFFD4";
        }

        function increaseFont() {
            let para = document.getElementById("para");
            let currentSize = parseInt(window.getComputedStyle(para).fontSize);
            para.style.fontSize = (currentSize + 2) + "px";
        }

        function togglePara() {
            let para = document.getElementById("para");
            para.style.display = para.style.display === "none"? "block" : "none";
        }

        function resetPage() {
            document.getElementById("heading").innerText = originalHeading;
            document.getElementById("mainContainer").style.background = originalBg;
            document.getElementById("para").style.fontSize = originalFont + "px";
            document.getElementById("para").style.display = "block";
            document.getElementById("inputText").value = "";
        }
    </script>
</body>
</html>
