<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOISTING</title>
</head>
<body>
    <h3>Hoisting : A variable can be used before its function declaration. (works only for function) </h3>
    <script>
        
        //HOISTING FUNCTION
        greet();
        console.log(greet);
        function add(a,b) {
            return a+b;
        }
        function greet(){
            console.log("Hello First Year");
        }

        //NON - HOISTING
        const greeting = () => {
            console.log("Hello")
        }
        greeting();

        //VARIABLE HOISTING
        console.log(a);
        var a = 24;
        console.log(a);

        //console.log(b);                   ERROR OCCUR.. COZ NON-VARIABLE HOISTING
        let b = 25;
        console.log(b);

        //arrow function
        const addFun = (a, b) => {
            return (a + b);
        }
        console.log(addFun(7,5));

        //annymous function and iife(immediately invoked function expression)
        {() => console.log("Hey")};
    </script>
</body>
</html>
