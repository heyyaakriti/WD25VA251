<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM MANUPULATION</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #5ff194, #50bff6, #b24fd3);
            text-align: center;
        }
        .container {
            width: 450px;
            margin: 60px auto;
            padding: 25px;
            background: rgb(200, 249, 255);
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }
        .resetBtn{
            text-align: center;
            padding: 10px 15px;
            margin: 10px;
            background-color: rgb(194, 8, 8);
        }
        .resetBtn:hover{
            background-color: rgb(94, 6, 6);
        }
        button {
            padding: 9px 12px;
            margin: 5px;
            background-color: #01bc2a;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #036f0c;
        }
        input {
            padding: 8px;
            width: 250px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 id="mainHeading">Welcome to JavaScript Lab</h2>
        <input type="text" id="userInput" placeholder="Enter new heading">
        <br><br>
        <button id="changeTextBtn">CHANGE HEADING</button>
        <button id="bgColorBtn">CHANGE BG COLOUR</button>
        <button id="fontSizeBtn">INCREASE FONTSIZE</button>
        <button id="toggleBtn">SHOW/HIDE PARAGRAPH</button>
        
        <p id="paragraph">THIS IS A DYNAMIC PARAGRAPH....<br><b>TRY HIDING ME🫣</b></p>
        <button class="resetBtn">RESET</button>
    </div>
    <script src="exp6.js"></script>
</body>
</html>
